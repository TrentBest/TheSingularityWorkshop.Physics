name: Physics Build and Tests

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Execute C# experiment and serialize actual run record
        run: dotnet run --project tools/ProjectileRunRecordGenerator/ProjectileRunRecordGenerator.csproj --configuration Release -- /tmp/projectile-trajectory.actual.json

      - name: Execute a bounded custom experiment
        run: dotnet run --project tools/ProjectileRunRecordGenerator/ProjectileRunRecordGenerator.csproj --configuration Release -- /tmp/projectile-trajectory.custom.json --delta-time=0.1 --steps=20 --vx=3 --vy=1 --vz=4 --ax=0.5 --ay=0 --az=-9.81

      - name: Verify custom run inputs and sample count
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path('/tmp/projectile-trajectory.custom.json').read_text(encoding='utf-8'))
          definition = record['definition']
          samples = record['samples']
          observed = {
              'deltaTime': definition.get('deltaTime'),
              'initialVelocity': definition.get('initialState', {}).get('velocity'),
              'acceleration': definition.get('acceleration'),
              'sampleCount': len(samples),
              'finalElapsedTime': samples[-1].get('elapsedTime') if samples else None,
          }
          print(json.dumps(observed, indent=2))
          assert observed['deltaTime'] == 0.1, 'Unexpected timestep'
          assert observed['initialVelocity'] == {'x': 3, 'y': 1, 'z': 4}, 'Unexpected initial velocity'
          assert observed['acceleration'] == {'x': 0.5, 'y': 0, 'z': -9.81}, 'Unexpected acceleration'
          assert observed['sampleCount'] == 21, 'Unexpected sample count'
          assert abs(observed['finalElapsedTime'] - 2.0) < 1e-12, 'Unexpected final logical time'
          print('Custom bounded experiment inputs and 21 recorded states verified.')
          PY

      - name: Verify custom run record is reproducible
        run: dotnet run --project tools/ProjectileRunRecordGenerator/ProjectileRunRecordGenerator.csproj --configuration Release -- /tmp/projectile-trajectory.custom.json --delta-time=0.1 --steps=20 --vx=3 --vy=1 --vz=4 --ax=0.5 --ay=0 --az=-9.81 --check

      - name: Verify Markdown summary matches actual C# experiment
        run: python3 tools/render_projectile_trajectory_markdown.py /tmp/projectile-trajectory.actual.json docs/experiments/projectile-trajectory.md --check

      - name: Render SVG from actual C# run record
        run: python3 tools/render_projectile_trajectory.py /tmp/projectile-trajectory.actual.json /tmp/projectile-trajectory.actual.svg

      - name: Verify checked-in SVG matches actual C# experiment
        run: cmp /tmp/projectile-trajectory.actual.svg docs/experiments/projectile-trajectory.svg

      - name: Verify checked-in SVG matches the documented fixture
        run: python3 tools/render_projectile_trajectory.py docs/experiments/projectile-trajectory.run.json docs/experiments/projectile-trajectory.svg --check

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Physics.sln

      - name: Test with coverage
        run: dotnet test TheSingularityWorkshop.Physics.sln --configuration Release --no-restore --collect:"XPlat Code Coverage;Format=cobertura" --results-directory ./TestResults

      - name: Verify package can be created
        run: dotnet pack TheSingularityWorkshop.Physics.csproj --configuration Release --no-restore --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: physics-nuget-package
          path: ./artifacts/*.nupkg
