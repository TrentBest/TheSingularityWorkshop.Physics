name: Physics Build and Tests

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Execute C# experiment and serialize actual run record
        run: dotnet run --project tools/ProjectileRunRecordGenerator/ProjectileRunRecordGenerator.csproj --configuration Release -- /tmp/projectile-trajectory.actual.json

      - name: Verify Markdown summary matches actual C# experiment
        run: python3 tools/render_projectile_trajectory_markdown.py /tmp/projectile-trajectory.actual.json docs/experiments/projectile-trajectory.md --check

      - name: Render SVG from actual C# run record
        run: python3 tools/render_projectile_trajectory.py /tmp/projectile-trajectory.actual.json /tmp/projectile-trajectory.actual.svg

      - name: Verify checked-in SVG matches actual C# experiment
        run: cmp /tmp/projectile-trajectory.actual.svg docs/experiments/projectile-trajectory.svg

      - name: Verify checked-in SVG matches the documented fixture
        run: python3 tools/render_projectile_trajectory.py docs/experiments/projectile-trajectory.run.json docs/experiments/projectile-trajectory.svg --check

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Physics.sln

      - name: Test with coverage
        run: dotnet test TheSingularityWorkshop.Physics.sln --configuration Release --no-restore --collect:"XPlat Code Coverage;Format=cobertura" --results-directory ./TestResults

      - name: Verify package can be created
        run: dotnet pack TheSingularityWorkshop.Physics.csproj --configuration Release --no-restore --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: physics-nuget-package
          path: ./artifacts/*.nupkg
