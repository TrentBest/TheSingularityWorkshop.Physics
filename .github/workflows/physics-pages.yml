name: Physics Pages

on:
  push:
    branches:
      - development
    paths:
      - "site/**"
      - "docs/experiments/projectile-trajectory.run.json"
      - "docs/experiments/terrain-height-field.run.json"
      - "docs/experiments/acoustic-observation.run.json"
      - "docs/experiments/acoustic-observation.svg"
      - "tools/AcousticObservationRunRecordGenerator/**"
      - "tools/render_acoustic_observation.py"
      - "tools/ProjectileRunRecordGenerator/**"
      - "tools/TerrainHeightFieldRunRecordGenerator/**"
      - "Physics/Experiments/ProjectileTrajectoryExperiment.cs"
      - ".github/workflows/physics-pages.yml"
  pull_request:
    branches:
      - development
    paths:
      - "site/**"
      - "docs/experiments/projectile-trajectory.run.json"
      - "docs/experiments/terrain-height-field.run.json"
      - "docs/experiments/acoustic-observation.run.json"
      - "docs/experiments/acoustic-observation.svg"
      - "tools/AcousticObservationRunRecordGenerator/**"
      - "tools/render_acoustic_observation.py"
      - "tools/ProjectileRunRecordGenerator/**"
      - "tools/TerrainHeightFieldRunRecordGenerator/**"
      - "Physics/Experiments/ProjectileTrajectoryExperiment.cs"
      - ".github/workflows/physics-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check browser application JavaScript syntax
        run: |
          node --check site/navigation-fsm.js
          node --check site/app.js

      - name: Test navigation FSM routes and transitions
        run: node --test site/tests/*.test.mjs

      - name: Reproduce projectile run from Physics
        run: dotnet run --project tools/ProjectileRunRecordGenerator/ProjectileRunRecordGenerator.csproj --configuration Release -- /tmp/projectile-trajectory.actual.json

      - name: Validate source, published, and generated run records agree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("docs/experiments/projectile-trajectory.run.json"),
              Path("site/data/projectile-trajectory.run.json"),
              Path("/tmp/projectile-trajectory.actual.json"),
          ]
          records = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          assert records[0] == records[1], "The Pages copy differs from the canonical experiment fixture."
          assert records[0] == records[2], "The canonical fixture differs from the current Physics generator output."
          record = records[0]
          assert record["modelId"] == "kinematics.constant-acceleration-projectile"
          assert record["definition"]["coordinateFrame"] == "world, Z-up"
          assert len(record["samples"]) == record["definition"]["stepCount"] + 1
          assert record["samples"][0]["elapsedTime"] == 0
          assert record["samples"][-1]["elapsedTime"] == 2
          print("PASS: Pages data is byte-independent JSON-equivalent to the canonical and freshly generated Physics run.")
          PY

      - name: Reproduce acoustic observation from Physics
        run: |
          dotnet run --project tools/AcousticObservationRunRecordGenerator/AcousticObservationRunRecordGenerator.csproj --configuration Release -- /tmp/acoustic-observation.actual.json
          python3 tools/render_acoustic_observation.py /tmp/acoustic-observation.actual.json /tmp/acoustic-observation.actual.svg

      - name: Validate acoustic source, Pages data, and rendered evidence agree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path("docs/experiments/acoustic-observation.run.json").read_text(encoding="utf-8"))
          published = json.loads(Path("site/data/acoustic-observation.run.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("/tmp/acoustic-observation.actual.json").read_text(encoding="utf-8"))
          assert canonical == published, "The Pages acoustic record differs from the canonical experiment fixture."
          assert canonical == generated, "The canonical acoustic fixture differs from current Physics generator output."
          assert canonical["modelId"] == "acoustics.free-field-point-source-observation"
          assert canonical["observation"]["distanceMeters"] == 5
          print("PASS: acoustic Pages data matches the canonical and freshly generated Physics observation.")
          PY
          cmp docs/experiments/acoustic-observation.svg /tmp/acoustic-observation.actual.svg
          cmp docs/experiments/acoustic-observation.svg site/data/acoustic-observation.svg
          echo "PASS: canonical and Pages acoustic SVGs match freshly rendered model output."

      - name: Validate terrain record against TerrainHeightField2D generator
        run: |
          dotnet run --project tools/TerrainHeightFieldRunRecordGenerator/TerrainHeightFieldRunRecordGenerator.csproj --configuration Release -- docs/experiments/terrain-height-field.run.json --check
          dotnet run --project tools/TerrainHeightFieldRunRecordGenerator/TerrainHeightFieldRunRecordGenerator.csproj --configuration Release -- site/data/terrain-height-field.run.json --check

      - name: Verify static site entry points and data
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/data/projectile-trajectory.run.json
          test -s site/data/terrain-height-field.run.json
          test -s site/data/acoustic-observation.run.json
          test -s site/data/acoustic-observation.svg
          grep -q 'type="module" src="./app.js"' site/index.html
          echo "PASS: Physics Pages static entry points are present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/development'
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/deploy-pages.yml@5083c452b555d7645dd0c8ab01d76008026da436
