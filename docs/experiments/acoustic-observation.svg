  <text x="390" y="373" fill="#e4edf4" font-family="sans-serif" font-size="15">Arrival delay: 0.014577259 s at 343 m/s</text>
  <text x="390" y="396" fill="#e4edf4" font-family="sans-serif" font-size="15">Estimated received level: 66.0206 dB SPL</text>
