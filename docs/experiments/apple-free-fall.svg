<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">An apple falls: the motion, recorded and explained</title>
<desc id="desc">An apple is shown at each of 11 recorded times beside height-time and velocity-time graphs generated from the same run record. Model kinematics.constant-acceleration; no physics is recomputed by this illustration.</desc>
