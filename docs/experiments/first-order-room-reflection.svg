<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">First-order room reflection path</title>
  <desc id="desc">Source-derived top-down view of one direct path and one first-order reflection from the maximum-X wall. Path levels are separate estimates, not combined audio.</desc>
  <rect width="720" height="470" rx="18" fill="#101923"/>
  <text x="28" y="34" fill="#8de8ff" font-family="sans-serif" font-size="17" font-weight="700">SINGULARITY STUDIOS · FIRST-ORDER ROOM PATH</text>
  <text x="28" y="55" fill="#a6b8c7" font-family="sans-serif" font-size="12">C# Physics model output · 10 m × 10 m room plan at z = 5 m</text>
  <rect x="90" y="85" width="500" height="250" fill="#152633" stroke="#90a4b5" stroke-width="2"/>
  <line x1="140.00" y1="85" x2="140.00" y2="335" stroke="#263947"/><line x1="90" y1="310.00" x2="590" y2="310.00" stroke="#263947"/><line x1="190.00" y1="85" x2="190.00" y2="335" stroke="#263947"/><line x1="90" y1="285.00" x2="590" y2="285.00" stroke="#263947"/><line x1="240.00" y1="85" x2="240.00" y2="335" stroke="#263947"/><line x1="90" y1="260.00" x2="590" y2="260.00" stroke="#263947"/><line x1="290.00" y1="85" x2="290.00" y2="335" stroke="#263947"/><line x1="90" y1="235.00" x2="590" y2="235.00" stroke="#263947"/><line x1="340.00" y1="85" x2="340.00" y2="335" stroke="#263947"/><line x1="90" y1="210.00" x2="590" y2="210.00" stroke="#263947"/><line x1="390.00" y1="85" x2="390.00" y2="335" stroke="#263947"/><line x1="90" y1="185.00" x2="590" y2="185.00" stroke="#263947"/><line x1="440.00" y1="85" x2="440.00" y2="335" stroke="#263947"/><line x1="90" y1="160.00" x2="590" y2="160.00" stroke="#263947"/><line x1="490.00" y1="85" x2="490.00" y2="335" stroke="#263947"/><line x1="90" y1="135.00" x2="590" y2="135.00" stroke="#263947"/><line x1="540.00" y1="85" x2="540.00" y2="335" stroke="#263947"/><line x1="90" y1="110.00" x2="590" y2="110.00" stroke="#263947"/>
  <line x1="590" y1="85" x2="590" y2="335" stroke="#ffbf69" stroke-width="6"/>
  <text x="578" y="76" text-anchor="end" fill="#ffcf8a" font-family="sans-serif" font-size="11">Reflecting wall · x-max</text>
  <line x1="190.00" y1="210.00" x2="490.00" y2="160.00" stroke="#8de8ff" stroke-width="3"/>
  <polyline points="190.00,210.00 590.00,170.00 490.00,160.00" fill="none" stroke="#ffbf69" stroke-width="3" stroke-dasharray="8 5"/>
  <circle cx="190.00" cy="210.00" r="7" fill="#8de8ff" stroke="#eafaff" stroke-width="2"/>
  <circle cx="490.00" cy="160.00" r="7" fill="#b8f7c4" stroke="#f1fff4" stroke-width="2"/>
  <rect x="585.00" y="165.00" width="10" height="10" fill="#ffbf69" stroke="#fff0d5" stroke-width="1.5"/>
  <text x="200.00" y="228.00" fill="#dff8ff" font-family="sans-serif" font-size="12">Source (2, 5)</text>
  <text x="480.00" y="147.00" text-anchor="end" fill="#d6ffe0" font-family="sans-serif" font-size="12">Listener (8, 7)</text>
  <text x="580.00" y="192.00" text-anchor="end" fill="#ffcf8a" font-family="sans-serif" font-size="12">Bounce (10, 6.6)</text>
  <line x1="28" y1="365" x2="64" y2="365" stroke="#8de8ff" stroke-width="3"/>
  <text x="73" y="369" fill="#e4edf4" font-family="sans-serif" font-size="12">Direct path · 6.325 m · 18.44 ms · 63.98 dB SPL</text>
  <line x1="28" y1="390" x2="64" y2="390" stroke="#ffbf69" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="73" y="394" fill="#e4edf4" font-family="sans-serif" font-size="12">One reflection · 10.198 m · 29.73 ms · 53.81 dB SPL</text>
  <text x="28" y="425" fill="#a6b8c7" font-family="sans-serif" font-size="11">Wall pressure-amplitude coefficient: 0.50. Per-path estimates are not summed.</text>
  <text x="28" y="447" fill="#a6b8c7" font-family="sans-serif" font-size="11">No waveform, phase/interference, frequency-dependent absorption, or multiple reflections.</text>
</svg>
