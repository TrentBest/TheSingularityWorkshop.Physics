<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">A polygon is a path that closes</title><desc id="desc">Five labeled vertices form a counter-clockwise polygon. Its signed area is 14 square coordinate units. Example points are classified as inside, boundary, and outside.</desc>
<rect width="900" height="560" fill="#fbfcfe"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">A shape is more than a picture</text><text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#536078">A closed boundary connects ordered points. The numbers come from the lesson record.</text>
<g transform="translate(90 120)"><path d="M 70 440 L 550 440 L 550 110 L 310 0 L 70 110 Z" fill="#dceafe" stroke="#2457a6" stroke-width="4" stroke-linejoin="round"/>
<g fill="#2457a6" stroke="#ffffff" stroke-width="3"><circle cx="70" cy="440" r="8"/><circle cx="550" cy="440" r="8"/><circle cx="550" cy="110" r="8"/><circle cx="310" cy="0" r="8"/><circle cx="70" cy="110" r="8"/></g>
<g font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#172033"><text x="45" y="470">A (0, 0)</text><text x="558" y="470">B (4, 0)</text><text x="562" y="116">C (4, 3)</text><text x="296" y="-18">D (2, 4)</text><text x="12" y="116">E (0, 3)</text></g>
<circle cx="310" cy="220" r="7" fill="#16845b"/><text x="324" y="225" font-family="Arial,sans-serif" font-size="15" fill="#126346">inside</text><circle cx="310" cy="440" r="7" fill="#c27a13"/><text x="324" y="430" font-family="Arial,sans-serif" font-size="15" fill="#87520c">boundary</text><circle cx="670" cy="220" r="7" fill="#b54747"/><text x="684" y="225" font-family="Arial,sans-serif" font-size="15" fill="#913737">outside</text></g>
<g transform="translate(700 145)" font-family="Arial,sans-serif" fill="#172033"><text y="0" font-size="18" font-weight="700">Construction facts</text><text y="38" font-size="15">5 vertices</text><text y="66" font-size="15">5 boundary edges</text><text y="112" font-size="15" font-weight="700">Signed area</text><text y="145" font-size="28" fill="#2457a6">+14</text><text y="170" font-size="13" fill="#536078">coordinate-unit²</text><text y="220" font-size="14">Counter-clockwise</text><text y="242" font-size="14">simple boundary</text></g>
<text x="48" y="530" font-family="Arial,sans-serif" font-size="12" fill="#68758b">Teaching construction • not measured data • not a physical simulation</text></svg>