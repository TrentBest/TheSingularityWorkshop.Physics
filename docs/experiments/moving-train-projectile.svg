<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Moving-train projectile: one motion, two observers</title>
<desc id="desc">Two views of an idealized vertical launch from a train moving at 20 metres per second. The passenger plot shows height over time. The trackside plot shows the same height samples while horizontal position advances. This SVG is an analytical reference graphic; automated generation from the serialized run record is the next step.</desc>
<rect width="1000" height="440" rx="18" fill="#f7f9fc"/>
<text x="32" y="38" font-family="Arial" font-size="24" font-weight="700" fill="#14253d">ONE MOTION · TWO OBSERVERS</text>
<text x="32" y="62" font-family="Arial" font-size="14" fill="#475569">Default teaching case · train speed 20 m/s · launch speed 8 m/s · gravity −9.81 m/s²</text>
<text x="90" y="94" font-family="Arial" font-size="17" font-weight="700" fill="#14253d">Passenger: height vs time</text>
<text x="560" y="94" font-family="Arial" font-size="17" font-weight="700" fill="#14253d">Trackside: ground-frame path</text>
<rect x="90" y="100" width="350" height="200" fill="#fff" stroke="#9aa8b8"/>
<rect x="560" y="100" width="350" height="200" fill="#fff" stroke="#9aa8b8"/>
<g stroke="#d5dce5"><path d="M90 150H440 M90 200H440 M90 250H440 M560 150H910 M560 200H910 M560 250H910"/><path d="M177.5 100V300 M265 100V300 M352.5 100V300 M647.5 100V300 M735 100V300 M822.5 100V300"/></g>
<polyline points="90,200 133.75,157.66 177.5,130.66 221.25,118.98 265,122.63 308.75,141.60 352.5,175.91 396.25,225.54 440,290.50" fill="none" stroke="#1267a5" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="560,200 603.75,157.66 647.5,130.66 691.25,118.98 735,122.63 778.75,141.60 822.5,175.91 866.25,225.54 910,290.50" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<g fill="#1267a5" stroke="#fff" stroke-width="1.5"><circle cx="90" cy="200" r="4.5"/><circle cx="133.75" cy="157.66" r="4.5"/><circle cx="177.5" cy="130.66" r="4.5"/><circle cx="221.25" cy="118.98" r="4.5"/><circle cx="265" cy="122.63" r="4.5"/><circle cx="308.75" cy="141.60" r="4.5"/><circle cx="352.5" cy="175.91" r="4.5"/><circle cx="396.25" cy="225.54" r="4.5"/><circle cx="440" cy="290.50" r="4.5"/></g>
<g fill="#c2410c" stroke="#fff" stroke-width="1.5"><circle cx="560" cy="200" r="4.5"/><circle cx="603.75" cy="157.66" r="4.5"/><circle cx="647.5" cy="130.66" r="4.5"/><circle cx="691.25" cy="118.98" r="4.5"/><circle cx="735" cy="122.63" r="4.5"/><circle cx="778.75" cy="141.60" r="4.5"/><circle cx="822.5" cy="175.91" r="4.5"/><circle cx="866.25" cy="225.54" r="4.5"/><circle cx="910" cy="290.50" r="4.5"/></g>
<text x="265" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#14253d">Time (0–2 s)</text><text x="735" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#14253d">Ground X position (0–40 m)</text>
<text x="35" y="200" transform="rotate(-90 35 200)" text-anchor="middle" font-family="Arial" font-size="14" fill="#14253d">Height Z (m)</text><text x="505" y="200" transform="rotate(-90 505 200)" text-anchor="middle" font-family="Arial" font-size="14" fill="#14253d">Height Z (m)</text>
<text x="32" y="365" font-family="Arial" font-size="14" fill="#1267a5">Passenger: horizontal position relative to train stays at zero.</text><text x="32" y="389" font-family="Arial" font-size="14" fill="#c2410c">Trackside: horizontal position advances while vertical motion is unchanged.</text>
<text x="32" y="418" font-family="Arial" font-size="12" fill="#475569">Analytical reference graphic; no drag, collision, train acceleration, or terrain. Points at 0.25 s intervals.</text>
</svg>