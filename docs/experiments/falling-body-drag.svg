<title id="title">Falling body: drag changes the motion</title>
<desc id="desc">Two trajectories from 101 actual recorded C# states per case. The no-drag case falls farther and reaches a greater downward speed than the same body with quadratic drag. The SVG renders recorded values and does not solve the physics.</desc>
