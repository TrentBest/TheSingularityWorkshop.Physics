<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Central secants approach the derivative tangent</title>
<desc id="desc">A model-backed derivative visualization generated from five actual function samples. It compares coarse and fine central secants with the Richardson tangent estimate.</desc>
<rect width="960" height="540" fill="#ffffff"/>
<text x="48" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172554">From secant slopes to a tangent estimate</text>
<text x="48" y="70" font-family="Arial, sans-serif" font-size="15" fill="#334155">f(x) = 3x^2 + 2x - 7</text>
<path d="M 105 395 H 865" stroke="#64748b" stroke-width="1.5"/>
<path d="M 105 90 V 395" stroke="#64748b" stroke-width="1.5"/>
<path d="M 105.000 362.678 L 865.000 119.516" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M 295.000 303.992 L 675.000 182.411" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="5 4"/>
<path d="M 105.000 362.678 L 295.000 303.992 L 485.000 243.903 L 675.000 182.411 L 865.000 119.516" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 105.000 365.484 L 865.000 122.322" fill="none" stroke="#c2410c" stroke-width="3"/>
<circle cx="105.000" cy="362.678" r="6" fill="#172554" stroke="#ffffff" stroke-width="2"><title>f(3.8) = 43.92</title></circle>
<circle cx="295.000" cy="303.992" r="6" fill="#172554" stroke="#ffffff" stroke-width="2"><title>f(3.9) = 46.43</title></circle>
<circle cx="485.000" cy="243.903" r="6" fill="#172554" stroke="#ffffff" stroke-width="2"><title>f(4) = 49</title></circle>
<circle cx="675.000" cy="182.411" r="6" fill="#172554" stroke="#ffffff" stroke-width="2"><title>f(4.1) = 51.63</title></circle>
<circle cx="865.000" cy="119.516" r="6" fill="#172554" stroke="#ffffff" stroke-width="2"><title>f(4.2) = 54.32</title></circle>
<circle cx="485.000" cy="243.903" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<text x="105" y="435" font-family="Arial, sans-serif" font-size="14" fill="#334155">Input coordinate (s)</text>
<text x="105" y="470" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Coarse secant: 26 m/s</text>
<text x="390" y="470" font-family="Arial, sans-serif" font-size="16" fill="#0f766e">Fine secant: 26 m/s</text>
<text x="650" y="470" font-family="Arial, sans-serif" font-size="16" fill="#c2410c">Richardson: 26 m/s</text>
<text x="48" y="510" font-family="Arial, sans-serif" font-size="13" fill="#475569">Model-backed visualization · five recorded function evaluations · correction is an asymptotic indicator, not a bound</text>
</svg>
