  <text x="34" y="265" transform="rotate(-90 34 265)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#14253d">Z position (m)</text>
  <text x="110" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Z-up world frame · SI units · samples are solver states, not measured flight data</text>
</svg>