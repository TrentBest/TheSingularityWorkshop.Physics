<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Recorded 3D projectile experiment — X/Z side projection</title>
  <desc id="desc">Nine samples from a constant-acceleration point-projectile run, projected into the X/Z plane. Initial velocity is 10 metres per second horizontally and 12 metres per second upward; constant vertical acceleration is negative 9.81 metres per second squared. The run is sampled every 0.25 seconds through 2 seconds.</desc>
  <rect width="960" height="560" rx="18" fill="#f7f9fc"/>
  <text x="48" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#14253d">Projectile trajectory · sampled solver states</text>
  <text x="48" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Model: constant acceleration · point projectile · 9 recorded states · 0.25 s fixed step</text>
  <rect x="110" y="105" width="765" height="320" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.5"/>
  <line x1="110" y1="105" x2="110" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="110" y="450" text-anchor="middle" font-size="13" fill="#364152">0</text><line x1="205.625" y1="105" x2="205.625" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="205.625" y="450" text-anchor="middle" font-size="13" fill="#364152">2.5</text><line x1="301.25" y1="105" x2="301.25" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="301.25" y="450" text-anchor="middle" font-size="13" fill="#364152">5</text><line x1="396.875" y1="105" x2="396.875" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="396.875" y="450" text-anchor="middle" font-size="13" fill="#364152">7.5</text><line x1="492.5" y1="105" x2="492.5" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="492.5" y="450" text-anchor="middle" font-size="13" fill="#364152">10</text><line x1="588.125" y1="105" x2="588.125" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="588.125" y="450" text-anchor="middle" font-size="13" fill="#364152">12.5</text><line x1="683.75" y1="105" x2="683.75" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="683.75" y="450" text-anchor="middle" font-size="13" fill="#364152">15</text><line x1="779.375" y1="105" x2="779.375" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="779.375" y="450" text-anchor="middle" font-size="13" fill="#364152">17.5</text><line x1="875" y1="105" x2="875" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="875" y="450" text-anchor="middle" font-size="13" fill="#364152">20</text><line x1="110" y1="425" x2="875" y2="425" stroke="#d5dce5" stroke-width="1"/><text x="92" y="430" text-anchor="end" font-size="13" fill="#364152">0</text><line x1="110" y1="345" x2="875" y2="345" stroke="#d5dce5" stroke-width="1"/><text x="92" y="350" text-anchor="end" font-size="13" fill="#364152">2</text><line x1="110" y1="265" x2="875" y2="265" stroke="#d5dce5" stroke-width="1"/><text x="92" y="270" text-anchor="end" font-size="13" fill="#364152">4</text><line x1="110" y1="185" x2="875" y2="185" stroke="#d5dce5" stroke-width="1"/><text x="92" y="190" text-anchor="end" font-size="13" fill="#364152">6</text><line x1="110" y1="105" x2="875" y2="105" stroke="#d5dce5" stroke-width="1"/><text x="92" y="110" text-anchor="end" font-size="13" fill="#364152">8</text>
