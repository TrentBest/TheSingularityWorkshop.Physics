<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Free-field acoustic level by distance</title>
  <desc id="desc">A plot generated from observations computed by FreeFieldAcoustics. It is analytical propagation metadata, not synthesized sound.</desc>
  <rect width="720" height="440" rx="18" fill="#101923"/>
  <text x="28" y="36" fill="#8de8ff" font-family="sans-serif" font-size="18" font-weight="700">SINGULARITY STUDIOS · CONTROLLED DISTANCE SWEEP</text>
  <text x="28" y="57" fill="#94a6b6" font-family="sans-serif" font-size="12">Actual FreeFieldAcoustics model output · reference 80 dB SPL at 1 m</text>
  <line x1="90" y1="262.86" x2="650" y2="262.86" stroke="#334452"/><text x="78" y="266.86" text-anchor="end" fill="#94a6b6" font-family="sans-serif" font-size="11">60</text><line x1="90" y1="228.93" x2="650" y2="228.93" stroke="#334452"/><text x="78" y="232.93" text-anchor="end" fill="#94a6b6" font-family="sans-serif" font-size="11">65</text><line x1="90" y1="195.00" x2="650" y2="195.00" stroke="#334452"/><text x="78" y="199.00" text-anchor="end" fill="#94a6b6" font-family="sans-serif" font-size="11">70</text><line x1="90" y1="161.07" x2="650" y2="161.07" stroke="#334452"/><text x="78" y="165.07" text-anchor="end" fill="#94a6b6" font-family="sans-serif" font-size="11">75</text><line x1="90" y1="127.14" x2="650" y2="127.14" stroke="#334452"/><text x="78" y="131.14" text-anchor="end" fill="#94a6b6" font-family="sans-serif" font-size="11">80</text>
  <line x1="90" y1="100" x2="90" y2="290" stroke="#637887"/>
  <line x1="90" y1="290" x2="650" y2="290" stroke="#637887"/>
  <polyline points="146.00,127.14 202.00,168.00 370.00,222.00 650.00,262.86" fill="none" stroke="#8de8ff" stroke-width="3"/>
  <circle cx="146.00" cy="127.14" r="6" fill="#8de8ff" stroke="#e3fbff" stroke-width="2"/><text x="146.00" y="115.14" text-anchor="middle" fill="#dff8ff" font-family="sans-serif" font-size="12">80.00 dB</text><circle cx="202.00" cy="168.00" r="6" fill="#8de8ff" stroke="#e3fbff" stroke-width="2"/><text x="202.00" y="156.00" text-anchor="middle" fill="#dff8ff" font-family="sans-serif" font-size="12">73.98 dB</text><circle cx="370.00" cy="222.00" r="6" fill="#8de8ff" stroke="#e3fbff" stroke-width="2"/><text x="370.00" y="210.00" text-anchor="middle" fill="#dff8ff" font-family="sans-serif" font-size="12">66.02 dB</text><circle cx="650.00" cy="262.86" r="6" fill="#8de8ff" stroke="#e3fbff" stroke-width="2"/><text x="650.00" y="250.86" text-anchor="middle" fill="#dff8ff" font-family="sans-serif" font-size="12">60.00 dB</text>
  <text x="370" y="318" text-anchor="middle" fill="#e4edf4" font-family="sans-serif" font-size="12">Distance from point source (metres)</text>
  <text x="390" y="340" fill="#e4edf4" font-family="sans-serif" font-size="13">1 m · 80.00 dB SPL · 2.92 ms</text><text x="390" y="360" fill="#e4edf4" font-family="sans-serif" font-size="13">2 m · 73.98 dB SPL · 5.83 ms</text><text x="390" y="380" fill="#e4edf4" font-family="sans-serif" font-size="13">5 m · 66.02 dB SPL · 14.58 ms</text><text x="390" y="400" fill="#e4edf4" font-family="sans-serif" font-size="13">10 m · 60.00 dB SPL · 29.15 ms</text>
  <text x="28" y="422" fill="#94a6b6" font-family="sans-serif" font-size="11">Ideal free field only. No room response, waveform synthesis, occlusion, or Doppler.</text>
</svg>
