 <circle cx="770" cy="183" r="9"/><circle cx="810" cy="207" r="9"/><circle cx="850" cy="183" r="9"/><circle cx="890" cy="207" r="9"/><circle cx="930" cy="183" r="9"/><circle cx="970" cy="207" r="9"/><circle cx="1010" cy="183" r="9"/>
