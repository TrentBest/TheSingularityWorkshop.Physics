<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
<title id="title">Cooling water: liquid motion, freezing, and an ice lattice</title>
<desc id="desc">A conceptual three-panel comparison. Warm liquid water has molecules moving and reorienting in a disordered arrangement. During freezing near the equilibrium point at ordinary pressure, liquid and solid can coexist while latent heat is removed. Ice Ih has a locally ordered, open hexagonal hydrogen-bond network. Molecules are schematic, not to scale, and this is not a molecular-dynamics simulation.</desc>
<defs>
 <marker id="motion" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2878b5"/></marker>
 <style>
 text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17212b}.h{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#4b5968}.label{font-size:16px;font-weight:650}.small{font-size:13px}.panel{fill:#f8fafc;stroke:#cbd5df;stroke-width:1.5}.water{fill:#dceeff;stroke:#2878b5;stroke-width:1.5}.ice{fill:#e8f7ff;stroke:#2878b5;stroke-width:1.6}.bond{stroke:#77a9c9;stroke-width:2;stroke-dasharray:4 3}.move{stroke:#2878b5;stroke-width:2.5;fill:none;marker-end:url(#motion)}
 </style>
</defs>
<rect width="1080" height="510" rx="18" fill="#fff"/>
<text x="30" y="38" class="h">Cooling water changes molecular organization—not just the thermometer</text>
<text x="30" y="62" class="sub">Conceptual molecular view · pure water near 1 atm · not to scale and not molecular-dynamics output</text>
<rect x="25" y="84" width="330" height="330" rx="12" class="panel"/>
<rect x="375" y="84" width="330" height="330" rx="12" class="panel"/>
<rect x="725" y="84" width="330" height="330" rx="12" class="panel"/>
<text x="45" y="116" class="h">1 · Liquid</text><text x="395" y="116" class="h">2 · Freezing</text><text x="745" y="116" class="h">3 · Ice Ih</text>
<text x="45" y="139" class="sub">Disordered; molecules translate</text><text x="395" y="139" class="sub">Liquid and solid may coexist</text><text x="745" y="139" class="sub">Ordered, open network</text>
