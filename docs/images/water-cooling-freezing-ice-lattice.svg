 <circle cx="81" cy="235" r="10" class="water"/><circle cx="125" cy="219" r="10" class="water"/><circle cx="177" cy="242" r="10" class="water"/><circle cx="225" cy="226" r="10" class="water"/><circle cx="285" cy="239" r="10" class="water"/>
 <circle cx="58" cy="288" r="10" class="water"/><circle cx="111" cy="278" r="10" class="water"/><circle cx="157" cy="300" r="10" class="water"/><circle cx="213" cy="281" r="10" class="water"/><circle cx="266" cy="302" r="10" class="water"/><circle cx="311" cy="279" r="10" class="water"/>
 <path d="M91 160 l18 -10 M125 203 l18 -10 M195 213 l17 -9 M253 250 l17 -8 M72 260 l16 -8 M235 317 l18 -9" class="move"/>
</g>
<!-- coexistence: liquid left, ordered crystal right -->
<g>
