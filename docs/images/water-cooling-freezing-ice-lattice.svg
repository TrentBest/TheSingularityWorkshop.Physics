 <circle cx="810" cy="255" r="9"/><circle cx="890" cy="255" r="9"/><circle cx="970" cy="255" r="9"/>
 <circle cx="770" cy="279" r="9"/><circle cx="810" cy="303" r="9"/><circle cx="850" cy="279" r="9"/><circle cx="890" cy="303" r="9"/><circle cx="930" cy="279" r="9"/><circle cx="970" cy="303" r="9"/><circle cx="1010" cy="279" r="9"/>
</g>
<text x="745" y="341" class="small">Hydrogen bonds constrain orientation;</text><text x="745" y="360" class="small">the open structure expands on freezing.</text>
<text x="45" y="370" class="small">Thermal motion generally slows</text><text x="45" y="389" class="small">as energy is removed.</text>
<text x="395" y="370" class="small">At about 0 °C for pure water</text><text x="395" y="389" class="small">at 1 atm; conditions can shift it.</text>
<line x1="30" y1="435" x2="1050" y2="435" stroke="#d5dde5"/>
<text x="30" y="461" class="label">Key idea</text>
<text x="115" y="461" class="small">Freezing is a phase transition with latent heat—not simply molecules becoming motionless.</text>
<text x="30" y="485" class="small">Schematic: molecular positions and bonds are illustrative. Real water's hydrogen-bond network fluctuates; this image does not compute molecular trajectories.</text>
</svg>