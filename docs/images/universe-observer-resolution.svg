<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One persistent universe, multiple calculation resolutions</title>
  <desc id="desc">A universe grid contains immediate, near, background, and distant resolution regions. Observer attention raises calculation detail, while elapsed logical time and causal history persist in every region. A conservative broadphase promotes possible contacts for finer collision work.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#64748b" stroke-width="1" opacity=".55"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="56" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">ONE UNIVERSE · DIFFERENT CALCULATION RESOLUTIONS</text>
  <text x="56" y="90" font-family="Arial,sans-serif" font-size="16" fill="#475569">State and elapsed time persist everywhere; attention changes computational detail.</text>
  <rect x="56" y="120" width="1088" height="408" rx="20" fill="url(#space)"/>
  <rect x="56" y="120" width="1088" height="408" rx="20" fill="url(#grid)"/>
  <g fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">
    <text x="82" y="154">DISTANT · analytical / scheduled evolution</text>
    <text x="850" y="154">BACKGROUND · aggregate models</text>
  </g>
  <circle cx="590" cy="322" r="170" fill="#38bdf8" opacity=".08"/>
  <circle cx="590" cy="322" r="116" fill="#38bdf8" opacity=".13"/>
  <circle cx="590" cy="322" r="68" fill="#38bdf8" opacity=".17"/>
  <circle cx="590" cy="322" r="28" fill="#f8fafc" stroke="#7dd3fc" stroke-width="4" filter="url(#glow)"/>
  <circle cx="590" cy="322" r="50" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 7"/>
  <circle cx="590" cy="322" r="94" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="7 8"/>
  <circle cx="590" cy="322" r="145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 10"/>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700">
    <text x="610" y="318" fill="#0f172a">OBSERVER</text>
    <text x="650" y="280" fill="#fde68a">IMMEDIATE</text>
    <text x="700" y="232" fill="#fdba74">NEAR</text>
    <text x="754" y="190" fill="#7dd3fc">COARSE / BACKGROUND</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1.5" fill="none" opacity=".8">
    <path d="M590 350L590 405L360 405"/>
    <path d="M730 290L805 290L805 350"/>
    <path d="M720 450L850 450"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#e2e8f0">
    <text x="98" y="424" font-size="17" font-weight="700">One persistent state</text>
    <text x="98" y="450" font-size="14">history · energy · pending events</text>
    <text x="824" y="374" font-size="17" font-weight="700">Wake on relevance</text>
    <text x="824" y="399" font-size="14">interaction · threshold · predicted contact</text>
    <text x="850" y="475" font-size="14">Not simulated every frame ≠ frozen</text>
  </g>
  <rect x="56" y="552" width="520" height="116" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="82" y="584" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#075985">CONSERVATIVE BROADPHASE</text>
  <text x="82" y="611" font-family="Arial,sans-serif" font-size="15" fill="#0c4a6e">Cheap bounds find possible contacts; candidates</text>
  <text x="82" y="633" font-family="Arial,sans-serif" font-size="15" fill="#0c4a6e">wake finer checks. Overlap is not a confirmed collision.</text>
  <rect x="600" y="552" width="544" height="116" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="626" y="584" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#92400e">TIME &amp; CAUSALITY</text>
  <text x="626" y="611" font-family="Arial,sans-serif" font-size="15" fill="#78350f">Analytical jump · aggregate integration · substeps</text>
  <text x="626" y="633" font-family="Arial,sans-serif" font-size="15" fill="#78350f">or event replay, selected by model validity.</text>
</svg>
