<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Idealized volcanic terrain deposition</title><desc id="desc">Conceptual before-and-after cross-section showing prescribed material volume distributed around a vent into a cone-shaped elevation profile. Not an eruption prediction.</desc><rect width="1000" height="400" rx="18" fill="#10151d"/><text x="34" y="42" fill="#f4f7fb" font-family="Arial" font-size="25" font-weight="700">TERRAIN CHANGE · PRESCRIBED DEPOSITION</text><text x="34" y="68" fill="#b8c7d8" font-family="Arial" font-size="14">Conceptual model geometry · not geological prediction</text><g transform="translate(40,100)" font-family="Arial"><text x="0" y="24" fill="#d5dee8" font-size="18" font-weight="700">Before</text><path d="M0 190H410" stroke="#aebdcd" stroke-width="2"/><path d="M0 190H410V220H0Z" fill="#46586c"/><g stroke="#77869a" stroke-width="1"><path d="M40 190V220 M80 190V220 M120 190V220 M160 190V220 M200 190V220 M240 190V220 M280 190V220 M320 190V220 M360 190V220"/></g><text x="0" y="260" fill="#aebdcd" font-size="14">Cell-centered elevation field</text></g><g transform="translate(535,100)" font-family="Arial"><text x="0" y="24" fill="#d5dee8" font-size="18" font-weight="700">After one declared event</text><path d="M0 190H410" stroke="#aebdcd" stroke-width="2"/><path d="M0 190 L70 190 L125 155 L175 112 L215 90 L255 112 L305 155 L350 190 L410 190V220H0Z" fill="#a65d3d" stroke="#e6b85c" stroke-width="2"/><g stroke="#f0c76b" stroke-width="1" opacity=".7"><path d="M40 190V220 M80 190V220 M120 158V220 M160 126V220 M200 94V220 M240 103V220 M280 140V220 M320 175V220 M360 190V220"/></g><text x="205" y="77" text-anchor="middle" fill="#f0c76b" font-size="14">vent</text><path d="M205 82V92" stroke="#f0c76b" stroke-width="1.5"/><text x="0" y="260" fill="#aebdcd" font-size="14">Prescribed volume, normalized over grid cells</text></g><text x="40" y="375" fill="#d5dee8" font-family="Arial" font-size="14">Implemented: idealized cone-shaped deposition. Not implemented: magma flow, eruption dynamics, cooling, ash, tectonics, or erosion.</text></svg>