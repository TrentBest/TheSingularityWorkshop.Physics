<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Shallow-water state concepts</title><desc id="desc">Conceptual side view labels bed elevation, water depth, free-surface elevation, and cell-to-cell flux. Not solver output.</desc><rect width="1000" height="420" rx="18" fill="#f7f9fc"/><text x="34" y="42" fill="#14253d" font-family="Arial" font-size="25" font-weight="700">SHALLOW WATER · STATE AND FLUX</text><text x="34" y="68" fill="#475569" font-family="Arial" font-size="14">Conceptual cross-section · not a solver snapshot</text><path d="M60 300 L170 300 L260 325 L370 325 L470 280 L570 290 L670 335 L780 320 L920 340 L920 370 L60 370Z" fill="#b98b60" stroke="#795a3a" stroke-width="2"/><path d="M60 185 L170 185 L260 210 L370 210 L470 165 L570 175 L670 220 L780 205 L920 225 L920 340 L780 320 L670 335 L570 290 L470 280 L370 325 L260 325 L170 300 L60 300Z" fill="#8ed5ee" fill-opacity=".82" stroke="#2788b2" stroke-width="2"/><path d="M60 185 L170 185 L260 210 L370 210 L470 165 L570 175 L670 220 L780 205 L920 225" fill="none" stroke="#1267a5" stroke-width="3"/><g font-family="Arial" fill="#14253d" font-size="15"><text x="90" y="150">Free-surface elevation</text><path d="M170 157V181" stroke="#14253d" stroke-width="1.5"/><text x="300" y="250">Water depth h</text><path d="M350 255V310" stroke="#14253d" stroke-width="1.5"/><text x="690" y="385">Bed elevation zᵦ</text><path d="M770 374V329" stroke="#795a3a" stroke-width="1.5"/></g><path d="M405 235H535" stroke="#1267a5" stroke-width="4"/><path d="M535 235l-12 -8v16z" fill="#1267a5"/><text x="470" y="225" text-anchor="middle" fill="#14253d" font-family="Arial" font-size="14">face flux</text><text x="35" y="405" fill="#475569" font-family="Arial" font-size="13">State includes depth and depth-integrated momentum; bed slope alone does not determine flow.</text></svg>