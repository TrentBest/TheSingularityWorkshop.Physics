<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Hydrodynamics world demonstrator roadmap</title>
<desc id="desc">Conceptual plan view of a bounded basin with a localized wave disturbance, wavefronts travelling toward and reflecting from the wall, a floating boat, a sloped shoreline, and a breakwater obstacle. The drawn waves and boat response are schematic, not generated by the current solver.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10253f"/><stop offset="1" stop-color="#193e58"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d9eaf"/><stop offset="1" stop-color="#236581"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f7d98a"/></marker>
</defs>
<rect width="1000" height="580" rx="20" fill="url(#bg)"/>
<text x="32" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">HYDRODYNAMICS WORLD: FROM BASIN TO COUPLED WORLD</text>
<text x="33" y="64" fill="#c7d8f1" font-family="Arial,sans-serif" font-size="13">Conceptual design image • wave shapes are not solver output</text>
<rect x="45" y="93" width="650" height="385" rx="12" fill="#172a3b" stroke="#d4b47a" stroke-width="10"/>
<rect x="57" y="105" width="626" height="361" rx="5" fill="url(#water)"/>
<path d="M57 105H683V166Q600 151 520 169T350 165T190 171T57 162Z" fill="#71bcae" opacity=".6"/>
<path d="M57 105H683V466H57Z" fill="none" stroke="#b2e7e5" stroke-width="1.5" opacity=".65"/>
<g fill="none" stroke="#c2f5ef" stroke-width="2.4" opacity=".9">
 <ellipse cx="218" cy="284" rx="35" ry="23"/>
 <ellipse cx="218" cy="284" rx="68" ry="46"/>
 <ellipse cx="218" cy="284" rx="102" ry="70"/>
 <ellipse cx="218" cy="284" rx="145" ry="99"/>
 <ellipse cx="218" cy="284" rx="187" ry="129"/>
</g>
<circle cx="218" cy="284" r="8" fill="#ffe18a" stroke="#fff" stroke-width="2"/>
<path d="M218 284L302 236" stroke="#ffe18a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="233" y="254" fill="#fff1bd" font-family="Arial,sans-serif" font-size="13" font-weight="700">disturbance</text>
<path d="M495 230l-28 48 15 18 22-5 16-25-13-23z" fill="#b6a68b" stroke="#f3dcb2" stroke-width="2"/>
<text x="532" y="252" fill="#fff" font-family="Arial,sans-serif" font-size="13">breakwater</text>
<path d="M530 256L510 267" stroke="#fff" stroke-width="1.5"/>
<g transform="translate(390 342) rotate(-12)">
 <path d="M-34 -10H29L17 10H-20Z" fill="#f6e2b0" stroke="#24364b" stroke-width="2"/>
 <path d="M-4 -8V-29L17 -8Z" fill="#e8f2f4" stroke="#24364b" stroke-width="1.5"/>
</g>
<text x="426" y="359" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">floating body</text>
<path d="M423 352L410 347" stroke="#fff" stroke-width="1.5"/>
<path d="M57 395Q116 370 160 395T257 395T350 395" fill="none" stroke="#b3c8a2" stroke-width="13" opacity=".85"/>
<text x="76" y="428" fill="#f1f8df" font-family="Arial,sans-serif" font-size="13">future sloped shore</text>
<path d="M77 418L99 400" stroke="#f1f8df" stroke-width="1.5"/>
<path d="M617 190q28 20 0 40t0 40t0 40" fill="none" stroke="#ffe18a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="625" y="177" fill="#fff1bd" font-family="Arial,sans-serif" font-size="12">reflection</text>
<rect x="719" y="94" width="244" height="386" rx="12" fill="#14253b" stroke="#587b9a"/>
<text x="741" y="124" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Build in verified stages</text>
<g font-family="Arial,sans-serif">
 <circle cx="746" cy="161" r="13" fill="#e5c77b"/><text x="746" y="166" text-anchor="middle" fill="#14253b" font-size="13" font-weight="700">H0</text>
 <text x="770" y="157" fill="#fff" font-size="14" font-weight="700">Analytical reference</text><text x="770" y="175" fill="#c7d8f1" font-size="12">speed, timing, reflection</text>
 <path d="M746 180v19" stroke="#587b9a" stroke-width="2"/>
 <circle cx="746" cy="213" r="13" fill="#73d0d0"/><text x="746" y="218" text-anchor="middle" fill="#14253b" font-size="13" font-weight="700">H1</text>
 <text x="770" y="209" fill="#fff" font-size="14" font-weight="700">2D shallow water</text><text x="770" y="227" fill="#c7d8f1" font-size="12">depth, momentum, flux</text>
 <path d="M746 232v19" stroke="#587b9a" stroke-width="2"/>
 <circle cx="746" cy="265" r="13" fill="#9dc78a"/><text x="746" y="270" text-anchor="middle" fill="#14253b" font-size="13" font-weight="700">H2</text>
 <text x="770" y="261" fill="#fff" font-size="14" font-weight="700">Terrain & obstacles</text><text x="770" y="279" fill="#c7d8f1" font-size="12">shorelines, islands, walls</text>
 <path d="M746 284v19" stroke="#587b9a" stroke-width="2"/>
 <circle cx="746" cy="317" r="13" fill="#f0a66b"/><text x="746" y="322" text-anchor="middle" fill="#14253b" font-size="13" font-weight="700">H3</text>
 <text x="770" y="313" fill="#fff" font-size="14" font-weight="700">Floating-body coupling</text><text x="770" y="331" fill="#c7d8f1" font-size="12">bounded boat model first</text>
 <path d="M741 357H941" stroke="#587b9a"/>
 <text x="741" y="383" fill="#fff" font-size="13" font-weight="700">Observe every run</text>
 <text x="741" y="405" fill="#c7d8f1" font-size="12">• water volume / boundary flux</text>
 <text x="741" y="425" fill="#c7d8f1" font-size="12">• wave height / travel time</text>
 <text x="741" y="445" fill="#c7d8f1" font-size="12">• boat state / diagnostics</text>
</g>
<rect x="45" y="497" width="918" height="54" rx="10" fill="#0d1a2c" stroke="#587b9a"/>
<text x="63" y="520" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Scientific rule:</text>
<text x="158" y="520" fill="#d4e2f3" font-family="Arial,sans-serif" font-size="14">water is evolving simulation state—not a scrolling visual effect.</text>
<text x="63" y="539" fill="#aebfda" font-family="Arial,sans-serif" font-size="12">The full world is a roadmap; only individually implemented and validated stages should be presented as working physics.</text>
</svg>