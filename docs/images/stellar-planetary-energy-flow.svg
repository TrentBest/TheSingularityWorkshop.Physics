<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">From stellar luminosity to planetary energy budget</title>
  <desc id="desc">Conceptual roadmap diagram. A configured star emits radiation; distance and surface orientation affect incident flux; a planet partitions energy into reflection, absorption and storage, transport, and thermal emission. This is not a solver result or a measured spectrum.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111b36"/><stop offset="1" stop-color="#24385a"/></linearGradient>
    <radialGradient id="star"><stop offset="0" stop-color="#fff6b0"/><stop offset=".55" stop-color="#ffc857"/><stop offset="1" stop-color="#f07836"/></radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61c8d5"/><stop offset="1" stop-color="#2870a6"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ffe08a"/></marker>
    <marker id="coolArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#91e6ef"/></marker>
  </defs>
  <rect width="1000" height="560" rx="20" fill="url(#space)"/>
  <g fill="#fff" opacity=".65"><circle cx="60" cy="54" r="2"/><circle cx="380" cy="72" r="1.5"/><circle cx="625" cy="42" r="2"/><circle cx="910" cy="92" r="1.5"/><circle cx="825" cy="455" r="2"/><circle cx="110" cy="470" r="1.5"/></g>
  <text x="34" y="38" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">STELLAR INPUT → PLANETARY RESPONSE</text>
  <text x="35" y="64" fill="#c7d8f1" font-family="Arial,sans-serif" font-size="13">Conceptual roadmap • not solver output • not to scale</text>
  <circle cx="142" cy="226" r="63" fill="#f6a94e" opacity=".17"/>
  <circle cx="142" cy="226" r="48" fill="url(#star)"/>
  <g stroke="#ffd87b" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M142 159v-13 M142 293v13 M75 226H62 M209 226h13 M95 179l-9-9 M189 273l9 9 M95 273l-9 9 M189 179l9-9"/>
  </g>
  <text x="142" y="315" fill="#fff3d0" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Configured star</text>
  <text x="142" y="337" fill="#d9e5f7" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">luminosity L (W)</text>
  <path d="M214 204 Q365 145 525 195" fill="none" stroke="#ffe08a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <path d="M214 226 Q365 226 525 226" fill="none" stroke="#ffe08a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <path d="M214 248 Q365 306 525 258" fill="none" stroke="#ffe08a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="360" y="151" fill="#ffe8a6" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Radiation crosses distance r</text>
  <rect x="285" y="337" width="220" height="61" rx="10" fill="#1c2d4a" stroke="#8299bd"/>
  <text x="395" y="360" fill="#fff" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Point-source approximation</text>
  <text x="395" y="383" fill="#ffe8a6" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">F(r) = L / (4πr²)</text>
  <path d="M580 226h56" stroke="#ffe08a" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="716" cy="226" r="76" fill="#6bc7d7" opacity=".16"/>
  <circle cx="716" cy="226" r="63" fill="url(#planet)"/>
  <path d="M670 183q18-20 34-8l8 20 24 4 7 20-24 15-4 25-20 10-10-24-21-9-8-22z" fill="#72bf83" opacity=".95"/>
  <path d="M733 166q24 7 35 27l-8 18-19 4-10-17z M753 251l16 5-7 20-18 5-8-13z" fill="#72bf83" opacity=".95"/>
  <path d="M670 144 A91 91 0 0 1 775 279" fill="none" stroke="#91e6ef" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#coolArrow)"/>
  <text x="716" y="322" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Planet / surface</text>
  <text x="716" y="343" fill="#d9e5f7" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">orientation · material · atmosphere</text>
  <path d="M774 197 C835 171 854 161 880 154" fill="none" stroke="#ffe08a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M775 226h105" fill="none" stroke="#ffe08a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M768 264 C823 291 850 303 880 313" fill="none" stroke="#91e6ef" stroke-width="2.5" marker-end="url(#coolArrow)"/>
  <rect x="857" y="112" width="119" height="59" rx="9" fill="#493b2b" stroke="#e9bd66"/>
  <text x="916" y="135" fill="#ffe8a6" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Reflected</text>
  <text x="916" y="153" fill="#ffe8a6" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">energy</text>
  <rect x="857" y="196" width="119" height="59" rx="9" fill="#234d52" stroke="#72d1c9"/>
  <text x="916" y="219" fill="#c6fff0" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Absorbed</text>
  <text x="916" y="237" fill="#c6fff0" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">and stored</text>
  <rect x="857" y="285" width="119" height="59" rx="9" fill="#24415e" stroke="#91e6ef"/>
  <text x="916" y="308" fill="#d2f8ff" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Transported</text>
  <text x="916" y="326" fill="#d2f8ff" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">or emitted</text>
  <rect x="34" y="433" width="932" height="89" rx="12" fill="#101a30" stroke="#536d91"/>
  <text x="54" y="460" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">The accounting rule</text>
  <text x="54" y="484" fill="#d9e5f7" font-family="Arial,sans-serif" font-size="14">Incident energy must be partitioned into reflection, absorption/storage, transport, and emission.</text>
  <text x="54" y="506" fill="#aebfda" font-family="Arial,sans-serif" font-size="13">Surface-angle response, atmospheric effects, and stellar spectra are model levels to add and validate—not silently assumed here.</text>
  <g transform="translate(45 405)" font-family="Arial,sans-serif" font-size="12" fill="#c7d8f1"><text x="0" y="0">Direct-beam incidence depends on surface normal n · direction s</text></g>
</svg>