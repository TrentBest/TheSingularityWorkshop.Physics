<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Lookup table sampling and linear interpolation</title><desc id="desc">Conceptual plot showing a smooth reference curve, discrete sample nodes, and piecewise straight interpolation segments. An animated query marker follows the interpolated segments; this is not a measured error plot for a specific table.</desc><style>@media (prefers-reduced-motion: reduce) { .query-marker, .query-cursor { display: none; } }</style><rect width="1000" height="440" rx="18" fill="#f7f9fc"/><text x="36" y="42" fill="#14253d" font-family="Arial" font-size="25" font-weight="700">LOOKUP TABLE · WHAT IS APPROXIMATED?</text><text x="36" y="68" fill="#475569" font-family="Arial" font-size="14">Conceptual illustration only · no numeric error claim</text><rect x="95" y="100" width="820" height="260" fill="#fff" stroke="#9aa8b8" stroke-width="1.5"/><g stroke="#d5dce5" stroke-width="1"><path d="M95 165H915 M95 230H915 M95 295H915 M259 100V360 M423 100V360 M587 100V360 M751 100V360"/></g><line class="query-cursor" x1="95" y1="100" x2="95" y2="360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5" opacity=".85"><animate attributeName="x1" values="95;259;423;587;751;915" keyTimes="0;.2;.4;.6;.8;1" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="95;259;423;587;751;915" keyTimes="0;.2;.4;.6;.8;1" dur="6s" repeatCount="indefinite"/></line><path d="M95 330 C180 310 215 230 300 205 S440 115 505 145 S660 265 750 205 S850 120 915 125" fill="none" stroke="#c2410c" stroke-width="3.5"/><polyline points="95,330 259,225 423,155 587,190 751,210 915,125" fill="none" stroke="#1267a5" stroke-width="3.5"/><circle class="query-marker" cx="95" cy="330" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2"><animateMotion dur="6s" repeatCount="indefinite" path="M95 330 L259 225 L423 155 L587 190 L751 210 L915 125"/></circle><g fill="#1267a5" stroke="#fff" stroke-width="2"><circle cx="95" cy="330" r="7"/><circle cx="259" cy="225" r="7"/><circle cx="423" cy="155" r="7"/><circle cx="587" cy="190" r="7"/><circle cx="751" cy="210" r="7"/><circle cx="915" cy="125" r="7"/></g><text x="95" y="392" fill="#14253d" font-family="Arial" font-size="15">input domain →</text><path d="M560 412H610" stroke="#c2410c" stroke-width="3.5"/><text x="620" y="417" fill="#14253d" font-family="Arial" font-size="14">reference function (conceptual)</text><path d="M95 412H145" stroke="#1267a5" stroke-width="3.5"/><circle cx="120" cy="412" r="5" fill="#1267a5"/><text x="155" y="417" fill="#14253d" font-family="Arial" font-size="14">samples + linear segments</text></svg>