<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Living spring-damper: compression and extension</title>
  <desc id="desc">A spring smoothly compresses and extends between two bodies. Equal and opposite spring-force arrows reverse direction as the separation passes through rest length. This is a conceptual illustration, not output from the Physics solver; damping is not visualized.</desc>
  <defs>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .compressed, .rest, .extended { animation-duration: 4s; animation-iteration-count: infinite; }
      .compressed { animation-name: compressed-label; }
      .rest { animation-name: rest-label; }
      .extended { animation-name: extended-label; }
      @keyframes compressed-label { 0%, 19% { opacity: 1; } 22%, 100% { opacity: 0; } }
      @keyframes rest-label { 0%, 43% { opacity: 0; } 48%, 52% { opacity: 1; } 57%, 100% { opacity: 0; } }
      @keyframes extended-label { 0%, 78% { opacity: 0; } 82%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .compressed, .rest, .extended { animation: none; opacity: 0; }
        .rest { opacity: 1; }
      }
    </style>
    <marker id="forceArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="20" fill="#f7f9fc"/>
  <text x="40" y="45" fill="#14253d" font-size="26" font-weight="750">A SPRING CHANGES LENGTH · FORCE CHANGES DIRECTION</text>
  <text x="40" y="75" fill="#475569" font-size="15">Conceptual property demonstration · equal-and-opposite axial spring forces</text>
  <line x1="70" y1="320" x2="930" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="100" y="200" width="120" height="100" rx="12" fill="#dbeafe" stroke="#2563a6" stroke-width="3"/>
  <text x="160" y="242" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="700">Body A</text>
  <text x="160" y="269" text-anchor="middle" fill="#1e3a8a" font-size="14">fixed</text>
  <path d="M 220 250 L 250 220 L 280 280 L 310 220 L 340 280 L 370 220 L 400 280 L 430 220 L 460 280 L 490 250" fill="none" stroke="#64748b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" values="M 220 250 L 250 220 L 280 280 L 310 220 L 340 280 L 370 220 L 400 280 L 430 220 L 460 280 L 490 250;M 220 250 L 270 220 L 320 280 L 370 220 L 420 280 L 470 220 L 520 280 L 570 220 L 620 280 L 670 250;M 220 250 L 250 220 L 280 280 L 310 220 L 340 280 L 370 220 L 400 280 L 430 220 L 460 280 L 490 250"/>
  </path>
  <g transform="translate(520 0)">
    <animateTransform attributeName="transform" type="translate" values="520 0;700 0;520 0" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <rect x="0" y="200" width="120" height="100" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="60" y="242" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="700">Body B</text>
    <text x="60" y="269" text-anchor="middle" fill="#9a3412" font-size="14">moves</text>
    <g class="compressed" fill="#c2410c" stroke="#c2410c" stroke-width="5" stroke-linecap="round">
      <path d="M 0 170 H 40"/><path d="M 40 170 l -12 -8 v 16 z"/>
    </g>
    <g class="extended" fill="#c2410c" stroke="#c2410c" stroke-width="5" stroke-linecap="round">
      <path d="M 0 170 H -40"/><path d="M -40 170 l 12 -8 v 16 z"/>
    </g>
  </g>
  <g stroke="#c2410c" stroke-width="5" stroke-linecap="round" fill="#c2410c">
    <g class="compressed"><path d="M 220 170 H 180"/><path d="M 180 170 l 12 -8 v 16 z"/></g>
    <g class="extended"><path d="M 220 170 H 260"/><path d="M 260 170 l -12 -8 v 16 z"/></g>
  </g>
  <text class="compressed" x="500" y="365" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="700">Compressed · restoring forces push apart</text>
  <text class="rest" x="500" y="365" text-anchor="middle" fill="#334155" font-size="21" font-weight="700">At rest length · ideal spring force is zero</text>
  <text class="extended" x="500" y="365" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="700">Extended · restoring forces pull together</text>
  <text x="40" y="414" fill="#475569" font-size="14">Spring force follows extension from rest length; arrows on A and B are equal and opposite.</text>
  <text x="40" y="440" fill="#64748b" font-size="12">Damping, inertia, and the numerical solver are intentionally not shown. Respect reduced-motion preference.</text>
</svg>
