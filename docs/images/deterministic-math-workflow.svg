<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Deterministic mathematics workflow</title><desc id="desc">Conceptual workflow from declared inputs and stable keys through a mathematical model to output, validation, and provenance. Not simulation output.</desc><rect width="1000" height="360" rx="18" fill="#10151d"/><text x="34" y="42" fill="#f4f7fb" font-family="Arial" font-size="25" font-weight="700">DETERMINISTIC MATH · EVIDENCE PATH</text><text x="34" y="68" fill="#b8c7d8" font-family="Arial" font-size="14">Conceptual workflow — not benchmark or statistical-quality evidence</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#f0c76b"/></marker></defs><g font-family="Arial"><rect x="32" y="110" width="190" height="86" rx="12" fill="#173a35" stroke="#53c8a0" stroke-width="2"/><text x="127" y="142" text-anchor="middle" fill="#f4f7fb" font-size="17" font-weight="700">Declared inputs</text><text x="127" y="166" text-anchor="middle" fill="#cce7df" font-size="13">units · seed · bounds</text><rect x="270" y="110" width="190" height="86" rx="12" fill="#173a35" stroke="#53c8a0" stroke-width="2"/><text x="365" y="142" text-anchor="middle" fill="#f4f7fb" font-size="17" font-weight="700">Stable identity</text><text x="365" y="166" text-anchor="middle" fill="#cce7df" font-size="13">entity · tick · purpose</text><rect x="508" y="110" width="190" height="86" rx="12" fill="#243247" stroke="#7ba8d8" stroke-width="2"/><text x="603" y="142" text-anchor="middle" fill="#f4f7fb" font-size="17" font-weight="700">Math / model</text><text x="603" y="166" text-anchor="middle" fill="#c8d8eb" font-size="13">analytical or sampled</text><rect x="746" y="110" width="222" height="86" rx="12" fill="#382d19" stroke="#e6b85c" stroke-width="2"/><text x="857" y="142" text-anchor="middle" fill="#f4f7fb" font-size="17" font-weight="700">Output + checks</text><text x="857" y="166" text-anchor="middle" fill="#f5dfac" font-size="13">repeat · residual · range</text><path d="M222 153H260 M460 153H498 M698 153H736" stroke="#f0c76b" stroke-width="2.5" marker-end="url(#a)"/><path d="M857 196V236H603V205" fill="none" stroke="#e6b85c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="730" y="258" text-anchor="middle" fill="#f0c76b" font-size="13">validation feeds model revision</text><rect x="270" y="285" width="460" height="45" rx="10" fill="#1a2430" stroke="#46586c"/><text x="500" y="313" text-anchor="middle" fill="#d5dee8" font-size="15">Record algorithm version, provenance, units, and limitations</text></g></svg>