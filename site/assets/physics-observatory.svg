<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d">
<title id="t">Physics observatory illustration</title>
<desc id="d">A conceptual scientific observatory showing an orbital path, a projectile trajectory, a terrain cross-section, and wave contours connected by a coordinate grid. Decorative overview, not a computed simulation.</desc>
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203c50"/><stop offset="1" stop-color="#111e2e"/></linearGradient>
 <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75e0d0" stop-opacity=".15"/><stop offset=".55" stop-color="#75e0d0"/><stop offset="1" stop-color="#f1c77b"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7ba1b6" stroke-opacity=".13"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="758" height="518" rx="24" fill="url(#space)" stroke="#53758a" stroke-opacity=".55"/>
<rect x="1" y="1" width="758" height="518" rx="24" fill="url(#grid)"/>
<g fill="none" stroke="#7fe0d0" stroke-opacity=".22"><circle cx="390" cy="225" r="155"/><circle cx="390" cy="225" r="205"/><ellipse cx="390" cy="225" rx="265" ry="112" transform="rotate(-24 390 225)"/></g>
<g transform="translate(390 225)"><circle r="43" fill="#d8a76c" fill-opacity=".16" stroke="#e6c28c" stroke-width="1.5"/><circle r="31" fill="#e2b97d" fill-opacity=".25"/><path d="M-31 8Q-10-19 12-8T33 6" fill="none" stroke="#f1c77b" stroke-width="3"/><path d="M-18-24Q-4-12 6-22T24-17" fill="none" stroke="#75e0d0" stroke-width="2"/></g>
<path d="M95 355 Q205 75 390 120 T655 110" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
<g fill="#f1c77b" stroke="#172638" stroke-width="4"><circle cx="95" cy="355" r="8"/><circle cx="390" cy="120" r="7"/><circle cx="655" cy="110" r="8"/></g>
<g fill="#dceaf0" font-family="Arial,sans-serif"><text x="62" y="390" font-size="13" letter-spacing="2">INITIAL STATE</text><text x="414" y="99" font-size="13" letter-spacing="2">OBSERVATION</text><text x="576" y="83" font-size="13" letter-spacing="2">NEXT STATE</text></g>
<g transform="translate(48 54)"><rect width="176" height="62" rx="10" fill="#122335" stroke="#54758a"/><text x="14" y="24" fill="#7fe0d0" font-family="Arial" font-size="10" letter-spacing="2">MECHANICS</text><text x="14" y="45" fill="#edf4f7" font-family="Arial" font-size="15">Motion · time · force</text></g>
<g transform="translate(518 355)"><rect width="194" height="106" rx="10" fill="#122335" stroke="#54758a"/><text x="14" y="24" fill="#f1c77b" font-family="Arial" font-size="10" letter-spacing="2">TERRAIN / WAVES</text><path d="M14 70L40 58 65 63 90 40 116 49 141 31 177 39" fill="none" stroke="#7fe0d0" stroke-width="2.5"/><path d="M14 82Q52 68 82 78T177 62" fill="none" stroke="#8cb8f0" stroke-width="1.5" stroke-opacity=".8"/><text x="14" y="98" fill="#9bb0bf" font-family="Arial" font-size="10">FIELDS · SHAPES · CHANGE</text></g>
<g transform="translate(65 435)" fill="#9bb0bf" font-family="Arial" font-size="10" letter-spacing="2"><text>MODEL</text><circle cx="62" cy="-4" r="2" fill="#f1c77b"/><text x="76">MEASURE</text><circle cx="159" cy="-4" r="2" fill="#f1c77b"/><text x="173">EXPLAIN</text></g>
</svg>